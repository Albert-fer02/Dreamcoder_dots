add_newline = true
palette = "dreamcoder"

format = """
[](fg:prompt_surface0)\
$username\
[](bg:prompt_surface1 fg:prompt_surface0)\
$directory\
[](bg:prompt_accent fg:prompt_surface1)\
$git_branch\
$git_status\
[](fg:prompt_accent)\
$fill\
$hostname\
$bun\
$nodejs\
$python\
$golang\
$rust\
$docker_context\
$cmd_duration
$character"""

[palettes.dreamcoder]
bg = "#f8f2ea"
text = "#15130f"
muted = "#4a463f"
prompt_bg = "#f6f1e8"
prompt_surface0 = "#fbefd9"
prompt_surface1 = "#dcc094"
prompt_surface2 = "#bd905a"
prompt_text = "#241911"
prompt_muted = "#63503e"
prompt_accent = "#925b25"
prompt_accent_2 = "#78522d"
sage = "#496f45"
diagnostic = "#36665a"
lavender = "#665593"
mauve = "#844c71"
error = "#9b4b40"

[username]
show_always = true
style_user = "bg:prompt_surface0 fg:prompt_text bold"
style_root = "bg:prompt_surface0 fg:error bold"
format = "[  $user ]($style)"

[hostname]
ssh_only = false
style = "fg:prompt_muted bold"
format = "[ 󰣇 $hostname ]($style) "

[directory]
style = "bg:prompt_surface1 fg:prompt_text bold"
format = "[  $path ]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = " "

[bun]
symbol = ""
style = "fg:prompt_accent bold"
format = "[ $symbol $version]($style)"

[nodejs]
symbol = ""
style = "fg:sage bold"
format = "[ $symbol $version]($style)"

[python]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $version]($style)"

[golang]
symbol = ""
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[rust]
symbol = ""
style = "fg:mauve bold"
format = "[ $symbol $version]($style)"

[docker_context]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $context]($style)"
only_with_files = true

[cmd_duration]
min_time = 1500
style = "fg:prompt_muted"
format = "[  $duration ]($style) "

[time]
disabled = true

[character]
success_symbol = "[❯](bold fg:prompt_accent)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:sage)"
