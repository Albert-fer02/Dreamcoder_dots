# ========================================================
# Dreamcoder Light — Starship prompt
# ========================================================
# Two-line powerline layout with context-aware modules.
# Line 1: username, directory, git + fill + battery/k8s/terraform/cmd/time
# Line 2: character (with exit code indicator on error)

add_newline = true
palette = "dreamcoder"
command_timeout = 500

format = """
[\uECA6](fg:prompt_surface0)\
$username\
[\uECA0](bg:prompt_surface1 fg:prompt_surface0)\
$directory\
[\uECA0](bg:prompt_accent fg:prompt_surface1)\
$git_branch\
$git_status\
[\uECB4](fg:prompt_accent)\
$fill\
$battery\
$kubernetes\
$terraform\
$cmd_duration\
$time
$character"""

right_format = ""

[palettes.dreamcoder]
bg = "#f3eadc"
text = "#17120d"
muted = "#352e22"
prompt_bg = "#f3eadc"
prompt_surface0 = "#fff0d8"
prompt_surface1 = "#d6ac72"
prompt_surface2 = "#b87c40"
prompt_text = "#20150c"
prompt_muted = "#53402e"
prompt_accent = "#8a5520"
prompt_accent_2 = "#a7471c"
sage = "#3d723d"
diagnostic = "#0d4a68"
lavender = "#57478b"
mauve = "#7d3e64"
error = "#842f24"
warning = "#654300"
border = "#66513b"
focus = "#0f6570"
link = "#824f16"

[username]
show_always = true
style_user = "bg:prompt_surface0 fg:prompt_text bold"
style_root = "bg:prompt_surface0 fg:error bold"
format = "[ \uf007 $user ]($style)"

[directory]
style = "bg:prompt_surface1 fg:prompt_text bold"
format = "[ \uf0F7 $path ]($style)"
truncation_length = 2
truncate_to_repo = true
home_symbol = ""

[git_branch]
symbol = "\uf418"
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "\ue727${count} "
ahead = "\u21E1${count} "
behind = "\u21E3${count} "
diverged = "\u2195\u21E1${ahead_count}\u21E3${behind_count} "
untracked = "?${count} "
stashed = "\uf0CF${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "\u00BB${count} "
deleted = "\u2718${count} "

[status]
disabled = false
format = "[$symbol]($style)"
symbol = "\u2717"
style = "bg:error fg:prompt_bg bold"
pipestatus = false

[battery]
disabled = false
display = [
    {threshold = 20, style = "fg:error bold", discharging_symbol = "\uf244 "},
]

[kubernetes]
format = '[$symbol$context( \($namespace\))]($style)'
style = "fg:diagnostic bold"
symbol = "\uF3B2 "
disabled = false
detect_env_vars = ["KUBECONFIG", "KUBERNETES_SERVICE_HOST", "KUBERNETES_PORT"]

[terraform]
format = "[$symbol$workspace]($style)"
style = "fg:lavender bold"
symbol = "\uFD31 "
disabled = false

[fill]
symbol = " "

[cmd_duration]
min_time = 2500
style = "fg:prompt_muted"
format = "[  \uf552 $duration ]($style)"

[time]
disabled = false
format = "[ $time ]($style)"
style = "fg:prompt_muted"

[character]
success_symbol = "[\u276F](bold fg:prompt_accent)"
error_symbol = "[\u276F](bold fg:error)"
vimcmd_symbol = "[\u276E](bold fg:sage)"

# Runtime versions - show only when relevant, keep compact
[bun]
symbol = "\uF5EF"
style = "fg:prompt_accent bold"
format = "[ $symbol $version]($style)"

[nodejs]
symbol = "\uE718"
style = "fg:sage bold"
format = "[ $symbol $version]($style)"

[python]
symbol = "\uE73C"
style = "fg:diag bold"
format = "[ $symbol $version]($style)"

[golang]
symbol = "\uE627"
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[rust]
symbol = "\uE7A8"
style = "fg:mauve bold"
format = "[ $symbol $version]($style)"

[java]
symbol = "\uE204"
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[container]
format = "[$symbol \uf48B $name]($style)"
style = "fg:warning bold"
symbol = "\uf4E6"

[custom.ai_session]
command = "cat ~/.cache/dreamcoder/ai-session.state 2>/dev/null || echo ''"
when = """test -f ~/.cache/dreamcoder/ai-session.state"""
format = "[\uf5B5 $output]($style)"
style = "fg:diag bold"

[docker_context]
symbol = "\uf308"
style = "fg:diag bold"
format = "[ $symbol $context]($style)"
only_with_files = true
