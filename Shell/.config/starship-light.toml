# ========================================================
# Dreamcoder Light — Starship prompt
# ========================================================
# Modern two-line layout with powerline segments.
# Line 1: context (directory, git)
# Line 2: input character only (clean)

add_newline = true
palette = "dreamcoder"
command_timeout = 500

format = """
[](fg:prompt_surface0)\
$username\
[](bg:prompt_surface1 fg:prompt_surface0)\
$directory\
[](bg:prompt_accent fg:prompt_surface1)\
$git_branch\
$git_status\
[](fg:prompt_accent)\
$fill\
$cmd_duration\
$time
$character"""

right_format = ""

[palettes.dreamcoder]
bg = "#f3eadc"
text = "#17120d"
muted = "#352e22"
prompt_bg = "#f3eadc"
prompt_surface0 = "#5e5950"
prompt_surface1 = "#765f3e"
prompt_surface2 = "#8b5928"
prompt_text = "#20150c"
prompt_muted = "#53402e"
prompt_accent = "#8a5520"
prompt_accent_2 = "#a7471c"
sage = "#3d723d"
diagnostic = "#0d4a68"
lavender = "#57478b"
mauve = "#7d3e64"
error = "#842f24"

[username]
show_always = true
style_user = "bg:prompt_surface0 fg:prompt_text bold"
style_root = "bg:prompt_surface0 fg:error bold"
format = "[  $user ]($style)"

[directory]
style = "bg:prompt_surface1 fg:prompt_text bold"
format = "[  $path ]($style)"
truncation_length = 2
truncate_to_repo = true
home_symbol = ""

[git_branch]
symbol = ""
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = " "

[cmd_duration]
min_time = 2500
style = "fg:prompt_muted"
format = "[  $duration ]($style)"

[time]
disabled = false
format = "[ $time ]($style)"
style = "fg:prompt_muted"

[character]
success_symbol = "[❯](bold fg:prompt_accent)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:sage)"

# Runtime versions - show only when relevant, keep compact
[bun]
symbol = ""
style = "fg:prompt_accent bold"
format = "[ $symbol $version]($style)"

[nodejs]
symbol = ""
style = "fg:sage bold"
format = "[ $symbol $version]($style)"

[python]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $version]($style)"

[golang]
symbol = ""
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[rust]
symbol = ""
style = "fg:mauve bold"
format = "[ $symbol $version]($style)"

[docker_context]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $context]($style)"
only_with_files = true
