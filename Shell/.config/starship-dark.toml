add_newline = true
palette = "dreamcoder"

format = """
[](fg:prompt_surface0)\
$username\
[](bg:prompt_surface1 fg:prompt_surface0)\
$directory\
[](bg:prompt_accent fg:prompt_surface1)\
$git_branch\
$git_status\
[](fg:prompt_accent)\
$fill\
$hostname\
$bun\
$nodejs\
$python\
$golang\
$rust\
$docker_context\
$cmd_duration
$character"""

[palettes.dreamcoder]
bg = "#0b0c0e"
text = "#f1eee7"
muted = "#b9bcc2"
prompt_bg = "#19120c"
prompt_surface0 = "#2a1d13"
prompt_surface1 = "#402c18"
prompt_surface2 = "#5a3a1f"
prompt_text = "#f4e9dd"
prompt_muted = "#d5c3b5"
prompt_accent = "#fbb974"
prompt_accent_2 = "#c9863f"
sage = "#9fb99f"
diagnostic = "#9ecad0"
lavender = "#c7b6e8"
mauve = "#d6a8ca"
error = "#d98a7a"

[username]
show_always = true
style_user = "bg:prompt_surface0 fg:prompt_text bold"
style_root = "bg:prompt_surface0 fg:error bold"
format = "[  $user ]($style)"

[hostname]
ssh_only = false
style = "fg:prompt_muted bold"
format = "[ 󰣇 $hostname ]($style) "

[directory]
style = "bg:prompt_surface1 fg:prompt_text bold"
format = "[  $path ]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = " "

[bun]
symbol = ""
style = "fg:prompt_accent bold"
format = "[ $symbol $version]($style)"

[nodejs]
symbol = ""
style = "fg:sage bold"
format = "[ $symbol $version]($style)"

[python]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $version]($style)"

[golang]
symbol = ""
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[rust]
symbol = ""
style = "fg:mauve bold"
format = "[ $symbol $version]($style)"

[docker_context]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $context]($style)"
only_with_files = true

[cmd_duration]
min_time = 1500
style = "fg:prompt_muted"
format = "[  $duration ]($style) "

[time]
disabled = true

[character]
success_symbol = "[❯](bold fg:prompt_accent)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:sage)"
