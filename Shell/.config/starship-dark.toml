# ========================================================
# Dreamcoder Ember Noir OLED — Starship prompt
# ========================================================
# Two-line powerline layout with context-aware modules.
# Line 1: ssh_context, directory, git + fill + battery/k8s/terraform/cmd/time
# Line 2: character (with exit code indicator on error)

add_newline = true
palette = "dreamcoder"
command_timeout = 500

format = """
[\uECA6](fg:prompt_surface0)\
$ssh_context\
[\uECA0](bg:prompt_surface1 fg:prompt_surface0)\
$directory\
[\uECA0](bg:prompt_accent fg:prompt_surface1)\
$git_branch\
$git_status\
[\uECB4](fg:prompt_accent)\
$fill\
$battery\
$kubernetes\
$terraform\
$cmd_duration\
$time
$character"""

right_format = ""

[palettes.dreamcoder]
bg = "#100f0d"
text = "#e8dfd0"
muted = "#c7b9aa"
prompt_bg = "#18100c"
prompt_surface0 = "#2a1c14"
prompt_surface1 = "#4a2c18"
prompt_surface2 = "#6a3e1e"
prompt_text = "#fff0df"
prompt_muted = "#dcc3aa"
prompt_accent = "#e6a15c"
prompt_accent_2 = "#d66f50"
sage = "#4db35f"
diagnostic = "#5f95ca"
lavender = "#d4b4e6"
mauve = "#e29cb4"
error = "#ed8a7a"
warning = "#e8b866"
border = "#968878"
focus = "#5f8f8f"
link = "#d99555"

[ssh_context]
format = "[$ssh_connection$user@$host]($style)"
style = "bg:prompt_surface0 fg:prompt_text bold"
ssh_only = false

[username]
show_always = false
style_user = "bg:prompt_surface0 fg:prompt_text bold"
style_root = "bg:prompt_surface0 fg:error bold"
format = "[ \uf081 $user ]($style)"
detect_env_vars = ["SSH_CONNECTION", "SSH_CLIENT", "SSH_TTY"]

[directory]
style = "bg:prompt_surface1 fg:prompt_text bold"
format = "[ \uf0F7 $path ]($style)"
truncation_length = 2
truncate_to_repo = true
home_symbol = ""

[git_branch]
symbol = "\uf418"
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "\ue727${count} "
ahead = "\u21E1${count} "
behind = "\u21E3${count} "
diverged = "\u2195\u21E1${ahead_count}\u21E3${behind_count} "
untracked = "?${count} "
stashed = "\uf0CF${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "\u00BB${count} "
deleted = "\u2718${count} "

[status]
disabled = false
format = "[$symbol]($style)"
symbol = "\u2717"
style = "bg:error fg:prompt_bg bold"
pipestatus = false

[battery]
disabled = false
display = [
    {threshold = 20, style = "fg:error bold", symbol = "\uf244 "},
]

[kubernetes]
format = "[$symbol$context( \($namespace\))]($style)"
style = "fg:diagnostic bold"
symbol = "\uF3B2 "
disabled = false
detect_env_vars = ["KUBECONFIG", "KUBERNETES_SERVICE_HOST", "KUBERNETES_PORT"]

[terraform]
format = "[$symbol$workspace]($style)"
style = "fg:lavender bold"
symbol = "\uFD31 "
disabled = false

[fill]
symbol = " "

[cmd_duration]
min_time = 2500
style = "fg:prompt_muted"
format = "[  \uf552 $duration ]($style)"

[time]
disabled = false
format = "[ $time ]($style)"
style = "fg:prompt_muted"

[character]
success_symbol = "[\u276F](bold fg:prompt_accent)"
error_symbol = "[\u276F](bold fg:error)"
vimcmd_symbol = "[\u276E](bold fg:sage)"

# Runtime versions - show only when relevant, keep compact
[bun]
symbol = "\uF5EF"
style = "fg:prompt_accent bold"
format = "[ $symbol $version]($style)"

[nodejs]
symbol = "\uE718"
style = "fg:sage bold"
format = "[ $symbol $version]($style)"

[python]
symbol = "\uE73C"
style = "fg:diag bold"
format = "[ $symbol $version]($style)"

[golang]
symbol = "\uE627"
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[rust]
symbol = "\uE7A8"
style = "fg:mauve bold"
format = "[ $symbol $version]($style)"

[java]
symbol = "\uE204"
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[container]
format = "[$symbol \uf48B $name]($style)"
style = "fg:warning bold"
symbol = "\uf4E6"

[custom.ai_session]
command = "cat ~/.cache/dreamcoder/ai-session.state 2>/dev/null || echo ''"
when = """test -f ~/.cache/dreamcoder/ai-session.state"""
format = "[\uf5B5 $output]($style)"
style = "fg:diag bold"

[docker_context]
symbol = "\uf308"
style = "fg:diag bold"
format = "[ $symbol $context]($style)"
only_with_files = true
