add_newline = true
palette = "dreamcoder"

format = """
[](fg:prompt_surface0)\
$username\
[](bg:prompt_surface1 fg:prompt_surface0)\
$directory\
[](bg:prompt_accent fg:prompt_surface1)\
$git_branch\
$git_status\
[](fg:prompt_accent)\
$fill\
$hostname\
$cmd_duration
$character"""

[palettes.dreamcoder]
bg = "#ebe4d6"
text = "#1a1713"
muted = "#4c443a"
prompt_bg = "#ebe4d6"
prompt_surface0 = "#f2e6d4"
prompt_surface1 = "#d3bc98"
prompt_surface2 = "#b88958"
prompt_text = "#261c14"
prompt_muted = "#574939"
prompt_accent = "#965f25"
prompt_accent_2 = "#96411e"
sage = "#466b41"
diagnostic = "#104b67"
lavender = "#5b4e86"
mauve = "#784762"
error = "#773126"

[username]
show_always = true
style_user = "bg:prompt_surface0 fg:prompt_text bold"
style_root = "bg:prompt_surface0 fg:error bold"
format = "[  $user ]($style)"

[hostname]
ssh_only = true
style = "fg:prompt_muted bold"
format = "[ 󰣇 $hostname ]($style) "

[directory]
style = "bg:prompt_surface1 fg:prompt_text bold"
format = "[  $path ]($style)"
truncation_length = 2
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:prompt_accent fg:prompt_bg bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = " "

[bun]
symbol = ""
style = "fg:prompt_accent bold"
format = "[ $symbol $version]($style)"

[nodejs]
symbol = ""
style = "fg:sage bold"
format = "[ $symbol $version]($style)"

[python]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $version]($style)"

[golang]
symbol = ""
style = "fg:lavender bold"
format = "[ $symbol $version]($style)"

[rust]
symbol = ""
style = "fg:mauve bold"
format = "[ $symbol $version]($style)"

[docker_context]
symbol = ""
style = "fg:diagnostic bold"
format = "[ $symbol $context]($style)"
only_with_files = true

[cmd_duration]
min_time = 2500
style = "fg:prompt_muted"
format = "[  $duration ]($style) "

[time]
disabled = true

[character]
success_symbol = "[❯](bold fg:prompt_accent)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:sage)"
