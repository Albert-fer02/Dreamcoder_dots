# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#95b5d5"
panel_bg = "#07090f"
surface0 = "#0d1015"
surface1 = "#14181e"
surface_dim = "#0d1015"
overlay0 = "#6b7e8e"
overlay1 = "#8c949f"
text = "#beccd8"
