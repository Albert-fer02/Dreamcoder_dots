# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#a4afee"
panel_bg = "#000000"
surface0 = "#050507"
surface1 = "#0c0c0e"
surface_dim = "#050507"
overlay0 = "#6d7788"
overlay1 = "#8c94a4"
text = "#bcc7d5"
subtext0 = "#8a96a7"
mauve = "#b98beb"
green = "#43b48b"
yellow = "#d1a126"
red = "#e88484"
blue = "#62b9e2"
teal = "#3a76d6"
