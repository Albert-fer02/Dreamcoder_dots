# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#A5C7E8"
panel_bg = "#070A13"
surface0 = "#0D121A"
surface1 = "#151C25"
surface_dim = "#0D121A"
overlay0 = "#526575"
overlay1 = "#708090"
text = "#E6EDF3"
subtext0 = "#A8B5C2"
