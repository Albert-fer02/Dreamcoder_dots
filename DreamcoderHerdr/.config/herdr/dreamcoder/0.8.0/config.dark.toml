# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#A5B4FC"
panel_bg = "#000000"
surface0 = "#060608"
surface1 = "#0D0D11"
surface_dim = "#060608"
overlay0 = "#68788F"
overlay1 = "#8795AA"
text = "#E2E8F0"
subtext0 = "#94A3B8"
mauve = "#D8B4FE"
green = "#34D399"
yellow = "#FBBF24"
red = "#FB8585"
blue = "#7DD3FC"
teal = "#3B82F6"
peach = "#C4B5FD"

[ui]
accent = "#6FA0AF"
pane_scrollbars = false

[keys]
prefix = "ctrl+a"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"
