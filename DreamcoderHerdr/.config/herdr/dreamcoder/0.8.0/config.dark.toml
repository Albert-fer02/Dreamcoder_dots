# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#A5C7E8"
panel_bg = "#070A13"
surface0 = "#0D121A"
surface1 = "#151C25"
surface_dim = "#0D121A"
overlay0 = "#6A8497"
overlay1 = "#8795a2"
text = "#E6EDF3"
subtext0 = "#A8B5C2"
mauve = "#B48EAD"
green = "#76C7A1"
yellow = "#E1C16D"
red = "#E38989"
blue = "#7CB0E6"
teal = "#A5C7E8"
peach = "#8FAFCB"

[ui]
accent = "#6FA0AF"
pane_scrollbars = false

[keys]
prefix = "ctrl+a"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"
