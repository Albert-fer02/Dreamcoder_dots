# Dreamcoder Dark Black OLED — Lazygit theme
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  theme:
    activeBorderColor:
      - "#A5B4FC" # accent
      - "bold"
    inactiveBorderColor:
      - "#68788F" # border
    searchingActiveBorderColor:
      - "#C4B5FD" # accent-2
      - "bold"
    optionsTextColor:
      - "#7DD3FC" # diagnostic
    selectedLineBgColor:
      - "#16161D" # selection
    inactiveViewSelectedLineBgColor:
      - "#16161D" # surface-2
    cherryPickedCommitFgColor:
      - "#7DD3FC"
    cherryPickedCommitBgColor:
      - "#C4B5FD"
    markedBaseCommitFgColor:
      - "#7DD3FC"
    markedBaseCommitBgColor:
      - "#A5B4FC"
    unstagedChangesColor:
      - "#FB8585" # error
    defaultFgColor:
      - "#E2E8F0" # text
  authorColors:
        "#A5B4FC": "#000000"
        "#C4B5FD": "#000000"
        "#7DD3FC": "#000000"
        "#34D399": "#000000"
        "#D8B4FE": "#000000"
  showFileTree: true
  showRandomTip: false
  nerdFontsVersion: "3"
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  mainPanelSplitMode: "flexible"
  language: "en"
git:
  diffRenderers:
    - colorArg: always
      command: delta --syntax-theme "Catppuccin Mocha" --paging=never
  merging:
    manualCommit: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --pretty=format:'%C(#A5B4FC)%h%Creset -%C(#C4B5FD)%d%Creset %s %C(#C0B5C0)(%cr) %C(#7DD3FC)<%an>%Creset' --date=relative"
update:
  method: never
