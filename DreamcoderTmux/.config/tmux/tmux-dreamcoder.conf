# Dreamcoder Light — tmux light theme
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-light.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#c8ad89,bg=default"
set -g pane-active-border-style "fg=#0f6570,bg=default"
set -g display-panes-colour "#824f16"
set -g display-panes-active-colour "#824f16"

# Status bar
set -g status-style "fg=#17120d,bg=#e6d7c4"
set -g status-left-style "fg=#f3eadc,bg=#824f16"
set -g status-right-style "fg=#352e22,bg=#e6d7c4"

set -g status-left "#[fg=#f3eadc,bg=#824f16,bold]  #S #[fg=#824f16,bg=#e6d7c4,nobold]"
set -g status-right "#[fg=#e6d7c4,bg=#e6d7c4]#[fg=#352e22,bg=#e6d7c4] %H:%M #[fg=#decbb1]#[fg=#352e22,bg=#decbb1] %d-%b-%y "

# Status position
set -g status-position top
set -g status-interval 5

# Window tabs
setw -g window-status-style "fg=#352e22,bg=#e6d7c4"
setw -g window-status-current-style "fg=#f3eadc,bg=#824f16,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-separator ""

# Message
set -g message-style "fg=#17120d,bg=#fff7ea"
set -g message-command-style "fg=#17120d,bg=#fff7ea"

# Mode (copy mode)
setw -g mode-style "fg=#f3eadc,bg=#0f6570"

# Bell
setw -g window-status-bell-style "fg=#f3eadc,bg=#842f24,bold"
