# Dreamcoder Ember Noir OLED — tmux dark theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-dark.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#392e21,bg=default"
set -g pane-active-border-style "fg=#5f8f8f,bg=default"
set -g display-panes-colour "#d99555"
set -g display-panes-active-colour "#d99555"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#181512"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#e8dfd0,bold]  #S  #[fg=#c7b9aa]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#c7b9aa"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#d99555,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#c7b9aa]#{b:pane_current_path}  #[fg=#e8dfd0,bold]%H:%M  "

# Message
set -g message-style "fg=#e8dfd0,bg=#201b16"
set -g message-command-style "fg=#e8dfd0,bg=#201b16"

# Mode (copy mode)
setw -g mode-style "fg=#100f0d,bg=#5f8f8f"

# Bell
setw -g window-status-bell-style "fg=#100f0d,bg=#ed8a7a,bold"
