# Dreamcoder tmux — Clean premium status bar
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# tmux = navigation frame; context = Starship prompt.
# Caramel (accent) used at ~10% — only for active state.

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#c8ad89,bg=default"
set -g pane-active-border-style "fg=#0f6570,bg=default"
set -g display-panes-colour "#824f16"
set -g display-panes-active-colour "#824f16"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#f4ebd9"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#3a302f,bold]  #S  #[fg=#c7b9aa]· "

# Window tabs — text-only, taupe muted / caramel active
set -g window-status-style "fg=#8a6a45"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#e2a85c,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted taupe + time bold cocoa
set -g status-right "#[fg=#c7b9aa]#{b:pane_current_path}  #[fg=#3a302f,bold]%H:%M  "

# Message
set -g message-style "fg=#17120d,bg=#fff7ea"
set -g message-command-style "fg=#17120d,bg=#fff7ea"

# Mode (copy mode)
setw -g mode-style "fg=#f3eadc,bg=#0f6570"

# Bell
setw -g window-status-bell-style "fg=#f3eadc,bg=#842f24,bold"
