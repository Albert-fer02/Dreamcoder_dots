# Tmux configuration for Dreamcoder OS
# https://github.com/dreamcoder08/dreamcoder-dots

# ─── General ───────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on

# ─── Key Bindings ──────────────────────────────────────
# Prefix: Ctrl+a (like screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes (Gentleman-style: v = vertical, d = horizontal)
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Navigate panes with vim-tmux-navigator (Alt+h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ─── Plugin: TPM ───────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
bind C-s run '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'

# ─── Session Management ────────────────────────────────
# Scratch terminal popup (Alt+g)
bind -n M-g if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -E -k "tmux new-session -A -s scratch"
}

# fzf-based session picker (prefix + f)
bind f run "tmux list-sessions -F '#S' | fzf --prompt='session> ' --height=10 | xargs -r tmux switch-client -t"

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# ─── Theme (Dreamcoder) ────────────────────────────────
# Source the active theme generated by `dreamcoder-theme sync`
source-file ~/.config/tmux/tmux-dreamcoder.conf

# ─── Status Bar ────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

# ─── TPM init (keep last) ──────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
