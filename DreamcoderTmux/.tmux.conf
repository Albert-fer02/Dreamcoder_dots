# Tmux configuration for Dreamcoder OS
# Architecture: gentleman-dots as base + dreamcoder extras + colors
# https://github.com/dreamcoder08/dreamcoder-dots

# ══════════════════════════════════════════════════════
# GENTLEMAN_DOTS_DIR
# ══════════════════════════════════════════════════════
# Set by the dreamcoder-dots installer. Change this path
# if you move gentleman-dots to a different location.
set-environment -gu GENTLEMAN_DOTS_DIR
set-environment -g GENTLEMAN_DOTS_DIR "$HOME/Gentleman.Dots"

# ─── Source gentleman-dots as base config ──────────────
# Provides: TPM, sensible, yank, navigator, resurrect,
# which-key, Kanagawa theme (git/cpu/ram), basic
# keybindings (C-a prefix, v/d splits, vi mode, clipboard),
# scratch popup (M-g), status bar position.
if-shell "test -f \$GENTLEMAN_DOTS_DIR/GentlemanTmux/tmux.conf" \
  "source-file \$GENTLEMAN_DOTS_DIR/GentlemanTmux/tmux.conf"

# ─── Dreamcoder-specific overrides ────────────────────
set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on

# ─── Extra plugins (no incluidos en gentleman-dots) ────
# Auto-save cada 15 minutos
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# ─── Terminal Features (específicas por terminal) ─────
# Truecolor para terminales modernos y SSH
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -g extended-keys on

# ─── Dreamcoder theme (colors only) ────────────────────
# Colorea paneles, ventanas, modo, mensajes, bell.
# Status bar minimal: session + windows + path + time.
# Git/status va en Starship prompt. CPU/RAM en popups.
source-file ~/.config/tmux/tmux-dreamcoder-base.conf

# ─── Remote Session Controls ──────────────────────────
# D (uppercase) para detach sin matar procesos
bind D detach-client
bind C-d detach-client
# Splits extra (gentleman-dots usa v/d, estos no conflictan)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# ─── Dreamcoder extras ────────────────────────────────
# fzf session picker (prefix + f)
bind f run "tmux list-sessions -F '#S' | fzf --prompt='session> ' --height=10 | xargs -r tmux switch-client -t"

# Navigate panes with Alt+hjkl (direct, no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resurrect manual save (C-s — complementa continuum)
bind C-s run '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ─── Popup launchers (orquestador agentic) ───────────────
# B = system monitor, G = git, F = file manager
# Access with prefix + key, no need to leave tmux
bind B display-popup -w 90% -h 80% -E "btop"
bind G display-popup -w 80% -h 70% -E "lazygit"
bind F display-popup -w 80% -h 70% -E "yazi"

# ─── Mobile Control Overlay ───────────────────────────
# Safe if missing
if-shell "test -f ~/.config/tmux/mobile-control.conf" \
  "source-file ~/.config/tmux/mobile-control.conf"
