# Dreamcoder Ember Noir OLED — tmux dark theme
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-dark.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#392e21,bg=default"
set -g pane-active-border-style "fg=#5f8f8f,bg=default"
set -g display-panes-colour "#d99555"
set -g display-panes-active-colour "#d99555"

# Status bar
set -g status-style "fg=#e8dfd0,bg=#181512"
set -g status-left-style "fg=#100f0d,bg=#d99555"
set -g status-right-style "fg=#c7b9aa,bg=#181512"

set -g status-left "#[fg=#100f0d,bg=#d99555,bold]  #S #[fg=#d99555,bg=#181512,nobold]"
set -g status-right "#[fg=#181512,bg=#181512]#[fg=#c7b9aa,bg=#181512] %H:%M #[fg=#2b231b]#[fg=#c7b9aa,bg=#2b231b] %d-%b-%y "

# Status position
set -g status-position top
set -g status-interval 5

# Window tabs
setw -g window-status-style "fg=#c7b9aa,bg=#181512"
setw -g window-status-current-style "fg=#100f0d,bg=#d99555,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-separator ""

# Message
set -g message-style "fg=#e8dfd0,bg=#201b16"
set -g message-command-style "fg=#e8dfd0,bg=#201b16"

# Mode (copy mode)
setw -g mode-style "fg=#100f0d,bg=#5f8f8f"

# Bell
setw -g window-status-bell-style "fg=#100f0d,bg=#ed8a7a,bold"
