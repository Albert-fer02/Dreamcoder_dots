# ========================================================
# Dreamcoder Ember Noir OLED — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#100f0d"
    foreground = "#e8dfd0"
    highlight = "#d99555"
    frame_color = "#756052"

[urgency_normal]
    background = "#201b16"
    foreground = "#e8dfd0"
    highlight = "#d99555"
    frame_color = "#968878"

[urgency_critical]
    background = "#52342e"
    foreground = "#e8dfd0"
    highlight = "#ed8a7a"
    frame_color = "#ed8a7a"
