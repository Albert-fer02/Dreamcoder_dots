# ========================================================
# Dreamcoder Dusk — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#ebe4d6"
    foreground = "#1a1713"
    highlight = "#8a5520"
    frame_color = "#a7947a"

[urgency_normal]
    background = "#f1eadf"
    foreground = "#1a1713"
    highlight = "#8a5520"
    frame_color = "#665845"

[urgency_critical]
    background = "#c8aea1"
    foreground = "#1a1713"
    highlight = "#773126"
    frame_color = "#773126"
