# GoReleaser configuration for dreamcoder-dots installer
# https://goreleaser.com
#
# Trigger: git tag v* && git push --tags
# Pipeline: build (4 platforms) → archive → release → homebrew cask

version: 2

project_name: dreamcoder-dots

before:
  hooks:
    - sh -c "cd installer && go mod tidy"

builds:
  - id: dreamcoder-dots
    dir: installer
    main: .
    binary: dreamcoder-dots
    ldflags:
      - -X github.com/dreamcoder08/dreamcoder-dots/installer/pkg/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}
    files:
      - none*

release:
  github:
    owner: Dreamcoder08
    name: Dreamcoder_dots
  header: |
    ## Dreamcoder OS {{ .Version }}

    > Token-governed visual operating layer.

    ### Install

    ```bash
    brew install Dreamcoder08/tap/dreamcoder-dots
    ```

    ### Changes

  footer: |
    **Full Changelog**: https://github.com/Dreamcoder08/Dreamcoder_dots/compare/{{ .PreviousTag }}...{{ .Tag }}

homebrew_casks:
  - name: dreamcoder-dots
    binaries:
      - dreamcoder-dots
    repository:
      owner: Dreamcoder08
      name: homebrew-tap
      branch: main
    homepage: "https://github.com/dreamcoder08/dreamcoder-dots"
    description: "Dreamcoder OS - Token-governed visual operating layer"
    license: "MIT"
    commit_author:
      name: dreamcoder-bot
      email: bot@dreamcoder08.github.com
