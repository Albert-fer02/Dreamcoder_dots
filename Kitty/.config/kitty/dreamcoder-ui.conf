# Dreamcoder Kitty readability layer
# Loaded AFTER kitty.conf and colors-dreamcoder.conf.
# Only overrides what ML4W doesn't handle for legibility.
# Do NOT duplicate settings from kitty.conf here.

# Font — Dreamcoder standard
font_family           JetBrainsMono Nerd Font
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             14

# Padding — comfortable reading
window_padding_width  18 20 18 20

# Opacity
background_opacity    0.96

# Performance
repaint_delay         1
input_delay           1

# Symbols
symbol_map            U+E000-U+F8FF,U+F0000-U+10FFFF Symbols Nerd Font

# Dreamcoder terminal shortcuts
map ctrl+l            clear_terminal reset active
map ctrl+shift+l      clear_terminal scrollback active
map ctrl+backspace    send_text all \x17
map ctrl+delete       send_text all \ed

# Dreamcoder Motion — cursor trail effect
cursor_trail          1
