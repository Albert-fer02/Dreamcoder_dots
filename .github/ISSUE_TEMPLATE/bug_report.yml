name: Bug Report
description: Create a report to help improve Dreamcoder OS
title: '[Bug]: '
labels: ['bug']
projects: []
assignees:
  - Dreamcoder08

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: When I run `dreamcoder light`, the colors don't update...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `dreamcoder dark`
        2. Open Kitty terminal
        3. Colors are wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in your environment details
      value: |
        - OS: [e.g. Arch Linux]
        - Terminal: [e.g. Kitty, Ghostty]
        - Shell: [e.g. Fish, Zsh]
        - Dreamcoder version: [e.g. 2.0.0]
        - Gentleman.Dots installed: [yes/no]
        - ML4W installed: [yes/no]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Run `dreamcoder doctor` and paste the output
      render: text
