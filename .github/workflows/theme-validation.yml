name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Shell check
        run: shellcheck --shell=bash scripts/*.sh

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Coverage
        run: python -m pytest tests/ --cov=dreamcoder_theme --cov-fail-under=40

      - name: Run theme health check
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/verify-theme-health.py

      - name: Generate theme preview
        continue-on-error: true
        run: python scripts/generate-theme-preview.py

      - name: Check for uncommitted changes
        continue-on-error: true
        run: |
          git diff --exit-code docs/dreamcoder-theme-preview.md || (echo "::error::Theme preview not regenerated" && exit 1)

  # publish job removed — use Release workflow for PyPI publishing
