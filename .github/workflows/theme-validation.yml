name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Debug - check environment
        run: |
          which python
          python --version
          python -m pytest --version
          python -c "import dreamcoder_theme; print('OK:', dreamcoder_theme.__version__)"
          python -c "from dreamcoder_theme.control import main; print('CLI OK:', main)"

      - name: Run tests
        run: python -m pytest tests/ -v 2>&1 | tail -30

      - name: Run theme health check
        run: python scripts/verify-theme-health.py

      - name: Generate theme preview
        run: python scripts/generate-theme-preview.py

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code docs/dreamcoder-theme-preview.md || (echo "::error::Theme preview not regenerated" && exit 1)

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
