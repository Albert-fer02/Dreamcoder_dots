name: CI (Go)

on:
  push:
    branches: [main]
    paths: ['installer/**']
  pull_request:
    branches: [main]
    paths: ['installer/**']

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    defaults:
      run:
        working-directory: installer

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: installer
