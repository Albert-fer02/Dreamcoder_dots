name: CI (Go)

on:
  push:
    branches: [main]
    paths: ["installer/**"]
  pull_request:
    branches: [main]
    paths: ["installer/**"]

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    defaults:
      run:
        working-directory: installer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      # golangci-lint disabled: its built-in Go version (1.24) is lower
      # than the module's minimum (1.25, required by dependencies)
