name: Repository Sync Enforcement

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-sync:
    name: Offline sync verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline repository sync verifier
        env:
          PYTHONPATH: src
        run: python3 scripts/verify-repo-sync.py

      - name: Run synchronization tests
        run: python -m pytest tests/test_herdr_contract.py tests/test_herdr_theme_generation.py tests/test_deploy_profiles.py tests/test_verify_repo_sync.py tests/test_upstream_diff.py -v --tb=short

  shell-dispatch:
    name: Shell dispatcher syntax and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Check dispatcher syntax
        run: bash -n scripts/dreamcoder

      - name: Run dispatcher tests (offline)
        run: bats tests/shell/test_dreamcoder_dispatch.bats
