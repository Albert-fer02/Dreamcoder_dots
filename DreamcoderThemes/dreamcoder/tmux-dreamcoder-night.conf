# Dreamcoder Dark Night — tmux dark theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-dark.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#141418,bg=default"
set -g pane-active-border-style "fg=#3a76d6,bg=default"
set -g display-panes-colour "#a4afee"
set -g display-panes-active-colour "#a4afee"
# Semantic token for status integrations that report successful commands.
set -g @dreamcoder-success-colour "#43b48b"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#050507"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#bcc7d5,bold]  #S  #[fg=#8a96a7]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#8a96a7"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#a4afee,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#8a96a7]#{b:pane_current_path}  #[fg=#bcc7d5,bold]%H:%M  "

# Message
set -g message-style "fg=#bcc7d5,bg=#050507"
set -g message-command-style "fg=#bcc7d5,bg=#050507"

# Mode (copy mode)
setw -g mode-style "fg=#000000,bg=#3a76d6"

# Bell
setw -g window-status-bell-style "fg=#000000,bg=#e88484,bold"
