# Dreamcoder Anthracite Steel Night — tmux dark theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-dark.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#1e242b,bg=default"
set -g pane-active-border-style "fg=#95b5d5,bg=default"
set -g display-panes-colour "#95b5d5"
set -g display-panes-active-colour "#95b5d5"
# Semantic token for status integrations that report successful commands.
set -g @dreamcoder-success-colour "#65b183"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#0d1015"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#beccd8,bold]  #S  #[fg=#8f9ca8]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#8f9ca8"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#95b5d5,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#8f9ca8]#{b:pane_current_path}  #[fg=#beccd8,bold]%H:%M  "

# Message
set -g message-style "fg=#beccd8,bg=#0d1015"
set -g message-command-style "fg=#beccd8,bg=#0d1015"

# Mode (copy mode)
setw -g mode-style "fg=#07090f,bg=#95b5d5"

# Bell
setw -g window-status-bell-style "fg=#07090f,bg=#d28c96,bold"
