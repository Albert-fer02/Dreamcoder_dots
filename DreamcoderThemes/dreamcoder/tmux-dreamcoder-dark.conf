# Dreamcoder Anthracite Steel — tmux dark theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-dark.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#202A35,bg=default"
set -g pane-active-border-style "fg=#A5C7E8,bg=default"
set -g display-panes-colour "#A5C7E8"
set -g display-panes-active-colour "#A5C7E8"
# Semantic token for status integrations that report successful commands.
set -g @dreamcoder-success-colour "#7FBF9A"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#0D121A"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#E6EDF3,bold]  #S  #[fg=#A8B5C2]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#A8B5C2"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#A5C7E8,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#A8B5C2]#{b:pane_current_path}  #[fg=#E6EDF3,bold]%H:%M  "

# Message
set -g message-style "fg=#E6EDF3,bg=#0D121A"
set -g message-command-style "fg=#E6EDF3,bg=#0D121A"

# Mode (copy mode)
setw -g mode-style "fg=#070A13,bg=#A5C7E8"

# Bell
setw -g window-status-bell-style "fg=#070A13,bg=#E69AA4,bold"
