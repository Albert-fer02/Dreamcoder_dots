# ========================================================
# Dreamcoder Anthracite Steel — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#070A13"
    foreground = "#E6EDF3"
    highlight = "#A5C7E8"
    frame_color = "#17202B"

[urgency_normal]
    background = "#0D121A"
    foreground = "#E6EDF3"
    highlight = "#A5C7E8"
    frame_color = "#526575"

[urgency_critical]
    background = "#4a353e"
    foreground = "#E6EDF3"
    highlight = "#E69AA4"
    frame_color = "#E69AA4"
