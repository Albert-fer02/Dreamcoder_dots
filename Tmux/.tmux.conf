# Tmux configuration for Dreamcoder OS
# https://github.com/dreamcoder08/dreamcoder-dots

# ─── General ───────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g focus-events on

# ─── Key Bindings ──────────────────────────────────────
# Prefix: Ctrl+a (like screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Navigate panes with Alt+arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ─── Theme (Dreamcoder) ────────────────────────────────
# Source the active theme generated by `dreamcoder-theme sync`
# The sync command creates a single active variant file at:
#   ~/.config/tmux/tmux-dreamcoder.conf
# Override with: TMUX_THEME=/path/to/theme.conf
source-file ~/.config/tmux/tmux-dreamcoder.conf

# ─── Status Bar ────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
